services:

  # ── Frontend (React + Vite → nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Browser must reach the backend — use the host-exposed port.
        # Override for remote access: API_BASE=http://<server-ip>:8000 docker compose up --build
        VITE_API_BASE: ${API_BASE:-http://localhost:8000}
    ports:
      - "3000:80"
    restart: unless-stopped

  # ── Backend master (Rocket web server + MPI rank 0) ───────────────────────────
  mpi-master:
    build: .
    volumes:
      - ./:/app
      - ./temp:/app/temp
    environment:
      - OMPI_ALLOW_RUN_AS_ROOT=1
      - OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
      - NODE_ROLE=master
    ports:
      - "8000:8000"
    hostname: mpi-master
    networks:
      - mpi-network
    restart: unless-stopped

  # ── Backend worker (MPI rank 1+) ──────────────────────────────────────────────
  mpi-worker:
    build: .
    volumes:
      - ./:/app
      - ./temp:/app/temp
    environment:
      - OMPI_ALLOW_RUN_AS_ROOT=1
      - OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
      - NODE_ROLE=worker
    depends_on:
      - mpi-master
    hostname: mpi-worker
    networks:
      - mpi-network
    restart: unless-stopped

# Docker's embedded DNS resolves "mpi-master" / "mpi-worker" on this network,
# which is all the MPI hostfile and SSH need — no static IPs or extra_hosts required.
networks:
  mpi-network:
    driver: bridge
